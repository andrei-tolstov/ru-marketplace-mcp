[project]
name = "drom-connector"
version = "2.1.0"
description = "baza.drom.ru MCP connector — auto parts, tires, oils and classifieds via Chrome CDP and HTML/JSON-LD"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir-Human", email = "39053957+Vladimir-Human@users.noreply.github.com" }]
dependencies = [
    "mcp-core==2.1.0",
    "fastmcp>=3.4.6,<4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "curl_cffi>=0.8",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
]

[project.scripts]
drom-mcp = "drom_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drom_connector"]

[tool.uv.sources]
mcp-core = { workspace = true }
